name: Publish

# Thin wrapper around the AllenNeuralDynamics shared publish reusable workflow.
# Fires when a v* tag is pushed (by bump-call.yml, or manually for the first
# release) and publishes to PyPI using the org AIND_PYPI_TOKEN.

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write # the reusable workflow creates a GitHub Release + uploads assets

concurrency:
  group: release
  cancel-in-progress: false # let releases finish

jobs:
  run-release:
    uses: AllenNeuralDynamics/galen-uv-workflows/.github/workflows/publish.yml@v2
    with:
      tag-name: ${{ github.ref_name }}
      python-version: "3.13"
      publish-to-pypi: true
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
      pypi-token: ${{ secrets.AIND_PYPI_TOKEN }}
