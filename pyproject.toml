[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commandants"
version = "0.2.0"
description = "A thin, transparent Python wrapper for the ANTs command-line tools (commandANTs)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Allen Neural Dynamics", email = "yoni.browning@alleninstitute.org" },
]
keywords = ["ANTs", "registration", "neuroimaging", "medical-imaging", "wrapper", "CLI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Zero required runtime dependencies: the core only shells out to ANTs.
dependencies = []

[project.optional-dependencies]
# In-memory image support (pass/receive SimpleITK images; result.load()).
io = ["SimpleITK>=2.2", "numpy>=1.21"]
dev = ["pytest>=7.0", "SimpleITK>=2.2", "numpy>=1.21"]

[project.scripts]
commandants = "commandants.__main__:main"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/commandants/"
Issues = "https://github.com/AllenNeuralDynamics/commandants/issues"
Changelog = "https://github.com/AllenNeuralDynamics/commandants/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/commandants"]

[dependency-groups]
# Installed by `uv sync` (used by the galen-uv CI). Tooling + test-time image libs
# so the SimpleITK-backed tests actually run in CI instead of importorskip-ing.
dev = ["pytest>=7.0", "pytest-cov", "ruff", "SimpleITK>=2.2", "numpy>=1.21"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scratch"]

[tool.ruff.lint]
# Pragmatic bar: pyflakes (F) + pycodestyle (E/W) + import sorting (I). Docstring (D),
# annotation (ANN), and pyupgrade (UP) enforcement are deferred for now, mirroring the
# deliberate `run-mypy: false` stance in ci-call.yml (commandants isn't held to that bar yet).
select = ["E", "F", "W", "I"]

[tool.commitizen]
version_provider = "pep621"
version_files = ["src/commandants/__init__.py:__version__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
